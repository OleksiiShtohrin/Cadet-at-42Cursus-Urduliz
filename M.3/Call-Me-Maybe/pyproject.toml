[project]
name = "call-me-maybe"
version = "1.5.0"
description = "Function calling system with constrained decoding for LLMs"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.12.5",
    "numpy>=2.2.6",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "flake8>=7.3.0",
]

# --- CPU-only PyTorch optimization for uv (prevents CUDA multi-GB download) ---
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
